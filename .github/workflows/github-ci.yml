name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # Detecta quais pastas mudaram para não buildar tudo sempre
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Api/**'
            frontend:
              - 'Platform/**'
            firmware:
              - 'Esp32/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Api
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build e testes
        run: mvn -B verify

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: Api/target/surefire-reports

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Platform
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Platform/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Testes unitários
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build de produção
        run: npm run build -- --configuration production

      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Platform/dist

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.1
    defaults:
      run:
        working-directory: Esp32
    steps:
      - uses: actions/checkout@v4

      - name: Compilar firmware (ESP-IDF)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build 2>&1 | tee /tmp/firmware-build.log

      - name: Publicar log do build (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-log
          path: /tmp/firmware-build.log

      - name: Publicar binário
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: Esp32/build/*.bin
